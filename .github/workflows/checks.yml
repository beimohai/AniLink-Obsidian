name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.2.6
      - run: python tests/test_audio_alignment.py
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test
      - run: npm run check
      - run: npm run package
