name: Release
on:
  push:
    tags: ['1.*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.2.6
      - run: python tests/test_audio_alignment.py
      - run: npm ci
      - run: npm run build && npm run lint && npm test && npm run check
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          version = os.environ["GITHUB_REF_NAME"]
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(r"^## " + re.escape(version) + r"[^\n]*\n(.*?)(?=^## |\Z)", changelog, re.M | re.S)
          if not match:
              raise SystemExit("Missing changelog for " + version)
          pathlib.Path("release-notes.md").write_text(match.group(1).strip() + "\n", encoding="utf-8")
          PY
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "AniLink $GITHUB_REF_NAME" --notes-file release-notes.md
